name: Build Flutter apps

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version used for a manual build (for example: 1.2.3)"
        required: false
        type: string
      build-number:
        description: "Build number (defaults to the current date in YYMMDD format)"
        required: false
        type: string
  workflow_call:
    secrets:
      SENTRY_DSN:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    inputs:
      version:
        description: "Version used for the build"
        required: true
        type: string
      build-number:
        description: "Build number (defaults to the current date in YYMMDD format)"
        required: false
        type: string

permissions:
  contents: read

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_ENVIRONMENT: production
  ARTIFACT_RETENTION_DAYS: 14
  PICQUERY_MODELS_BUNDLE_DIR: assets/models

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
        run: bash ci/resolve_version.sh >> "$GITHUB_OUTPUT"

  prepare-models:
    uses: ./.github/workflows/models.yml

  unit-tests:
    name: Unit tests
    needs: prepare-models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Analyze application
        run: flutter analyze lib/

      - name: Run all unit tests without diagnostics configured
        run: flutter test test/

      # Report tests use MockClient. A placeholder DSN enables their configured
      # branches without production credentials or sending diagnostics.
      - name: Test diagnostics with a configured DSN
        run: flutter test test/error_reporting_test.dart --dart-define=SENTRY_DSN=https://public@example.invalid/1

  integration-tests-desktop:
    name: Desktop integration tests
    needs: prepare-models
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Run desktop integration tests
        run: bash ci/test_integration.sh macos

  integration-tests-android:
    name: Android integration tests
    needs: prepare-models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Android integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/test_integration.sh android emulator-5554

  build-android:
    name: Android
    # Fork PRs have no signing secrets and must not request the build environment.
    if: github.event_name != 'pull_request'
    needs: [prepare-models, metadata, unit-tests]
    runs-on: ubuntu-latest
    environment: android-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build and package Android app
        shell: bash
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: ci/build.sh android "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.build_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-android
          path: PicQuery-*-android-arm64.apk
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Deliberately does not use the picquery-* artifact prefix. The release
      # workflow downloads only that prefix, so this AAB stays in Actions.
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: PicQuery-*-android.aab
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # Builds overlap integration tests; the release caller still waits for every job.
  build-macos:
    name: macOS
    needs: [prepare-models, metadata, unit-tests]
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Build and package macOS app
        shell: bash
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: ci/build.sh macos "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-macos
          path: PicQuery-*-macos.dmg
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-windows:
    name: Windows
    needs: [prepare-models, metadata, unit-tests]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Build and package Windows app
        shell: bash
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: ci/build.sh windows "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-windows
          path: PicQuery-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-linux:
    name: Linux
    needs: [prepare-models, metadata, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libcurl4-openssl-dev

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Build and package Linux app
        shell: bash
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: ci/build.sh linux "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-linux
          path: PicQuery-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
