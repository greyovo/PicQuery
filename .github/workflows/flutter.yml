name: Build Flutter apps

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version used for a manual build (for example: 1.2.3)"
        required: false
        type: string
      build-number:
        description: "Build number (defaults to the current date in YYMMDD format)"
        required: false
        type: string
  workflow_call:
    secrets:
      SENTRY_DSN:
        required: false
    inputs:
      version:
        description: "Version used for the build"
        required: true
        type: string
      build-number:
        description: "Build number (defaults to the current date in YYMMDD format)"
        required: false
        type: string

permissions:
  contents: read

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_ENVIRONMENT: production
  ARTIFACT_RETENTION_DAYS: 14
  PICQUERY_MODELS_BUNDLE_DIR: generated-models

jobs:
  prepare-models:
    name: Export PicQuery models
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out model exporter
        uses: actions/checkout@v4
        with:
          repository: greyovo/picquery-models
          path: picquery-models

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: picquery-models/uv.lock

      - name: Cache model checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: picquery-models-${{ runner.os }}-v1

      - name: Export and copy models
        shell: bash
        env:
          PICQUERY_MODELS_DIR: ${{ github.workspace }}/picquery-models
        run: bash scripts/prepare_models.sh

      - name: Upload generated models
        uses: actions/upload-artifact@v4
        with:
          name: picquery-models
          path: assets/models/*
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Android
    needs: prepare-models
    runs-on: ubuntu-latest
    environment: android-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: picquery-models
          path: generated-models

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
        run: |
          raw_version="${{ inputs.version }}"
          if [[ -z "$raw_version" ]]; then
            raw_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version/tag must look like v1.2.3, 1.2.3, or v1.2.3-beta.1: $raw_version" >&2
            exit 1
          fi
          build_number="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date +%y%m%d)}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Build number must contain digits only: $build_number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build and package Android app
        shell: bash
        run: ci/build.sh android "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-android
          path: PicQuery-*-android-arm64.apk
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Deliberately does not use the picquery-* artifact prefix. The release
      # workflow downloads only that prefix, so this AAB stays in Actions.
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: PicQuery-*-android.aab
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-macos:
    name: macOS
    needs: prepare-models
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: picquery-models
          path: generated-models

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
        run: |
          raw_version="${{ inputs.version }}"
          if [[ -z "$raw_version" ]]; then
            raw_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version/tag must look like v1.2.3, 1.2.3, or v1.2.3-beta.1: $raw_version" >&2
            exit 1
          fi
          build_number="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date +%y%m%d)}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Build number must contain digits only: $build_number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build and package macOS app
        shell: bash
        run: ci/build.sh macos "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-macos
          path: PicQuery-*-macos.dmg
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-windows:
    name: Windows
    needs: prepare-models
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: picquery-models
          path: generated-models

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
        run: |
          raw_version="${{ inputs.version }}"
          if [[ -z "$raw_version" ]]; then
            raw_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version/tag must look like v1.2.3, 1.2.3, or v1.2.3-beta.1: $raw_version" >&2
            exit 1
          fi
          build_number="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date +%y%m%d)}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Build number must contain digits only: $build_number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build and package Windows app
        shell: bash
        run: ci/build.sh windows "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-windows
          path: PicQuery-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-linux:
    name: Linux
    needs: prepare-models
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: picquery-models
          path: generated-models

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
        run: |
          raw_version="${{ inputs.version }}"
          if [[ -z "$raw_version" ]]; then
            raw_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version/tag must look like v1.2.3, 1.2.3, or v1.2.3-beta.1: $raw_version" >&2
            exit 1
          fi
          build_number="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date +%y%m%d)}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Build number must contain digits only: $build_number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build and package Linux app
        shell: bash
        run: ci/build.sh linux "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build_number }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: picquery-linux
          path: PicQuery-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
