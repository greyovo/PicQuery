name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the APK to, for example v1.1.4"
        required: true
        type: string
      models_url:
        description: "Model ZIP for this tag (defaults to repository MODELS_URL)"
        type: string
      models_sha256:
        description: "Model ZIP SHA-256 (defaults to repository MODELS_SHA256)"
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check release tooling
      run: python3 -m unittest discover -s scripts/tests -v

    - name: Prepare Android SDK
      run: |
        sdkmanager "cmdline-tools;22.0"
        "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" \
          "platforms;android-37.0" "build-tools;36.0.0" \
          "ndk;29.0.14206865" "cmake;3.22.1"

    - name: Restore model assets
      env:
        MODELS_URL: ${{ vars.MODELS_URL }}
        MODELS_SHA256: ${{ vars.MODELS_SHA256 }}
      run: python3 scripts/release_assets.py models .

    - name: Build with Gradle
      run: ./gradlew assembleDebug

  release-apk:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-apk-${{ github.event.release.tag_name || inputs.release_tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
    # Keep tooling from this workflow revision even when building a historical tag.
    - name: Check out release tooling
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false

    - name: Validate release target
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 scripts/release_assets.py tag "$RELEASE_TAG"
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

    - name: Validate signing secrets
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        missing=0
        for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing required repository secret: $name (see docs/releases.md)"
            missing=1
          fi
        done
        exit "$missing"

    - name: Check out the exact release tag
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
        path: release-source
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Android SDK
      run: |
        sdkmanager "cmdline-tools;22.0"
        sdk="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
        if [ -f release-source/app/build.gradle ]; then
          "$sdk" "platforms;android-34" "build-tools;34.0.0" "build-tools;36.0.0"
        else
          "$sdk" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"
        fi

    - name: Restore models matching the release tag
      env:
        MODELS_URL: ${{ inputs.models_url || vars.MODELS_URL }}
        MODELS_SHA256: ${{ inputs.models_sha256 || vars.MODELS_SHA256 }}
      run: python3 scripts/release_assets.py models release-source

    - name: Decode release keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        umask 077
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

    - name: Grant execute permission for gradlew
      working-directory: release-source
      run: chmod +x gradlew

    - name: Build signed release APK
      working-directory: release-source
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        ./gradlew --no-daemon assembleRelease \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
          -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

    - name: Verify signatures and packaged models
      run: |
        python3 scripts/release_assets.py apks release-source release-assets \
          --tag "$RELEASE_TAG" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"

    - name: Upload APK to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"

    - name: Remove release keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/release.keystore"
