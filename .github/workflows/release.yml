name: Publish a new release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (for example: v1.1.0)"
        required: true
        type: string
      build-number:
        description: "Build number (defaults to the current date in YYMMDD format)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    steps:
      - name: Allow only the repository owner
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$ACTOR" != "greyovo" ]]; then
            echo "Only greyovo can publish a release." >&2
            exit 1
          fi

  validate:
    name: Validate release
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      build_number: ${{ steps.release.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - name: Validate changelog entry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: dart ci/extract_release_notes.dart "$TAG" release-notes.md changelogs

      - name: Validate tag and find previous release
        id: release
        env:
          BUILD_NUMBER_INPUT: ${{ inputs['build-number'] }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1: $TAG" >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release already exists for tag: $TAG" >&2
            exit 1
          fi

          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ -z "$previous_tag" ]]; then
            echo "No previous stable release was found." >&2
            exit 1
          fi

          build_number="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date +%y%m%d)}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Build number must contain digits only: $build_number" >&2
            exit 1
          fi

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Upload validated release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload English changelog
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG_en
          path: changelogs/CHANGELOG_en.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload Chinese changelog
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG_zh
          path: changelogs/CHANGELOG_zh.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build release assets
    needs: validate
    uses: ./.github/workflows/flutter.yml
    secrets: inherit
    with:
      version: ${{ inputs.tag || github.ref_name }}
      build-number: ${{ needs.validate.outputs.build_number }}

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download validated release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          # Select only app artifacts; picquery-models is CI input.
          pattern: 'picquery-{android,macos,windows,linux}'
          path: dist
          merge-multiple: true

      - name: Download localized changelogs
        uses: actions/download-artifact@v4
        with:
          pattern: 'CHANGELOG_{en,zh}'
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        env:
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          printf '[查看提交对比](https://github.com/%s/compare/%s...%s)\n' \
            "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG" >> release-notes.md

      - name: Create and publish release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          tag_options=(--verify-tag)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_options=(--target "$GITHUB_SHA")
          fi
          version="${TAG#v}"
          release_assets=(
            "dist/PicQuery-$version-android-arm64.apk"
            "dist/PicQuery-$version-macos.dmg"
            "dist/PicQuery-$version-windows-x64-setup.exe"
            "dist/PicQuery-$version-linux-x64.tar.gz"
            "dist/CHANGELOG_en.md"
            "dist/CHANGELOG_zh.md"
          )
          for asset in "${release_assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          gh release create "$TAG" \
            "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_options[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md
