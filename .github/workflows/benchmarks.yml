name: Model performance benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-models:
    uses: ./.github/workflows/models.yml

  benchmark-desktop:
    name: Desktop benchmarks
    needs: prepare-models
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and model assets
        uses: ./.github/actions/setup-flutter

      - name: Run desktop benchmarks
        run: bash ci/test_integration.sh macos macos benchmarks

  benchmark-android:
    name: Android benchmarks
    needs: prepare-models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android and run benchmarks
        uses: ./.github/actions/test-android
        with:
          mode: benchmarks
