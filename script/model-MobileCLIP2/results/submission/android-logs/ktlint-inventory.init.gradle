gradle.projectsEvaluated {
    def appProject = gradle.rootProject.project(':app')
    def tasksAndScopes = [
        runKtlintCheckOverMainSourceSet: 'main',
        runKtlintCheckOverTestSourceSet: 'test',
        runKtlintCheckOverAndroidTestSourceSet: 'androidTest',
        runKtlintCheckOverKotlinScripts: 'kotlinScripts'
    ]
    tasksAndScopes.each { taskName, scope ->
        appProject.tasks.named(taskName).configure {
            doFirst {
                def files = source.files.collect { gradle.rootProject.relativePath(it).replace('\\', '/') }.sort()
                def payload = [scope: scope, task: taskName, count: files.size(), files: files]
                appProject.file('../build/mobileclip2-commit-ktlint-' + scope + '-sources.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + '\n'
                println('Verified ktlint source count: ' + scope + '=' + files.size())
            }
        }
    }
}
